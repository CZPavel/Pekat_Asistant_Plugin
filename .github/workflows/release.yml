name: Package GitHub release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/validate_public.py
      - run: python -m pytest -q
      - run: python scripts/smoke_tools.py
      - run: python scripts/build_release.py --output dist
      - name: Publish GitHub assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release view "$GITHUB_REF_NAME" || gh release create "$GITHUB_REF_NAME" --prerelease --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
